name: Build Fat JAR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        
      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: exec perm
        run: chmod +x gradlew

      - name: buildfatjar
        run: ./gradlew buildFatJar

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: fat-jar-output
          path: build/libs/*all*.jar
